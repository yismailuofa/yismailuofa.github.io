---
title: "reminders"
description: "A collection of reminders."
---

<section>
  <h2>Excerpts</h2>
  {% assign reminders = site.data.reminders.reminders %}
  {% assign shuffled = reminders | sample: reminders.size %}
  {% for reminder in shuffled %}
  <div class="excerpt">
    <p>{{ reminder.englishText }}</p>
    <cite>{{ reminder.cite }}</cite>
  </div>
  {% endfor %}
</section>
