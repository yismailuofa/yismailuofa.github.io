<div
  class="book-wheel"
  role="region"
  aria-labelledby="{{ include.label }}"
  tabindex="0"
>
  {% for book in include.books %}
  <div class="book">
    <p>
      {% if book.starred -%}
      <span class="book-star">✶</span>
      {%- endif %}
      <strong>
        {% if book.link %}
        <a href="{{ book.link }}">{{ book.title }}</a>
        {%- else -%} {{- book.title -}} {%- endif -%}
      </strong>
      <i class="book-author"> {{ book.author }}</i>
    </p>

    {% for entry in book.entries %}
    <p>{{ entry }}</p>
    {% endfor %}
  </div>
  {% endfor %}
</div>
